[project]
name = "rolex"
version = "0.0.0"
description = "A voice-driven assistant that runs locally on your Mac."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
rolex = "rolex.interface.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rolex"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# macOS writes binary AppleDouble sidecars ("._name.py") on this external
# volume. They match *.py but are not Python.
extend-exclude = ["._*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ['(^|/)\._']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
